<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` lets the background run under the notch; the safe
         area is added back as padding in CSS. Zoom is deliberately left alone:
         `user-scalable=no` would stop anyone who needs to magnify the board
         from doing so, and the layout is fluid enough not to need it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- One per scheme, so the browser chrome matches whichever the page is
         actually showing rather than always the dark canvas. -->
    <meta name="theme-color" content="#eef1ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#232599" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="dooz - in-a-row strategy. Classic Tic Tac Toe, bigger boards, Gomoku, Misère, Gravity, Vanish and Ultimate. Play a friend on one device, a six-level bot, a journey of rivals, daily puzzles, or a rated online ladder."
    />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="dooz - in-a-row strategy" />
    <meta property="og:description" content="Nine modes. A world of rivals. Your next move." />
    <meta property="og:image" content="/brand/social-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="dooz: pink crosses and amber rings on an indigo game board"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="dooz - in-a-row strategy" />
    <meta name="twitter:image" content="/brand/social-card.jpg" />
    <meta
      name="twitter:image:alt"
      content="dooz: pink crosses and amber rings on an indigo game board"
    />
    <title>dooz - in-a-row strategy</title>
