name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# A new push to the same branch makes the run in progress pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npx prettier --check .

      - name: Test
        run: npm test

      - name: Build
        run: npm run build:web
