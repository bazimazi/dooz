name: Desktop

# Installers for Windows, macOS and Linux.
#
# - Run by hand (Actions > Desktop > Run workflow) for test builds: the
#   installers are attached to the run as artifacts.
# - Pushing a `v*` tag does the same and also drafts a GitHub release with them,
#   plus the `latest.json` feed the in-app updater reads when it is configured.
#   Nothing is published until the draft is reviewed and released by hand.
#
# Every secret and variable below is optional. Without them the builds are
# unsigned and have no updater - fine for testing, not for shipping:
#
#   vars.VITE_SERVER_URL          multiplayer server (also written into the CSP)
#   vars.VITE_PUBLIC_URL          deployed web app, for invite links
#   vars.TAURI_UPDATER_ENDPOINTS  update feed, e.g. https://github.com/<owner>/<repo>/releases/latest/download/latest.json
#   vars.TAURI_UPDATER_PUBKEY     public half of `npx tauri signer generate`
#   secrets.TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#                                 signs update bundles (the private half)
#   secrets.APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#                                 macOS code signing (base64 .p12 + its password)
#   secrets.APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#                                 macOS notarization (app-specific password)
#
# Windows code signing needs a certificate provider of the owner's choosing
# (Azure Trusted Signing, a cloud HSM, ...); configure it as
# `bundle.windows.signCommand` once one is chosen.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # 22.04 rather than latest: an AppImage only runs on systems at least as
      # new as the one it was built on.
      - name: Install WebKitGTK and friends
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # A secret or variable that is not set still arrives as an empty string,
      # and the bundler treats an empty APPLE_CERTIFICATE as a certificate to
      # import. Only export the ones that actually have a value.
      - name: Use configured signing and deployment settings
        shell: bash
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
          TAURI_UPDATER_ENDPOINTS: ${{ vars.TAURI_UPDATER_ENDPOINTS }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in VITE_SERVER_URL VITE_PUBLIC_URL TAURI_UPDATER_ENDPOINTS TAURI_UPDATER_PUBKEY \
            TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              delimiter="EOF_$(openssl rand -hex 8)"
              { echo "$name<<$delimiter"; printf '%s\n' "${!name}"; echo "$delimiter"; } >> "$GITHUB_ENV"
            fi
          done

      # `scripts/tauri.mjs` fills in the CSP, updater and app-link settings
      # from the environment above before handing over to the Tauri CLI.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: node scripts/tauri.mjs
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: dooz ${{ github.ref_name }}
          releaseBody: See the assets below to download and install this version.
          releaseDraft: true
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: dooz-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/*/release/bundle/
          if-no-files-found: error
